<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Gestão de Produção</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">
</head>

<body>
  <div class="container">
    <nav>
      <div class="logo-menu">
        <img width="60" src="../frontend/docs/logo.png">
        <h2>Produção de MDF</h2>
      </div>
      <ul>
        <li>
          <a href="produtos.html">
            <i class="fa-solid fa-box"></i> Produtos
          </a>
        </li>

        <li>
          <a href="producao.html">
            <i class="fa-solid fa-industry"></i> Produção
          </a>
        </li>

        <li>
          <a href="historico.html">
            <i class="fa-solid fa-clock-rotate-left"></i> Histórico
          </a>
        </li>

      </ul>
    </nav>

    <main>
      <div class="topo">
        <div>
          <h1>Gestão de Produção</h1>
          <p>Registrar entradas e saídas de estoque</p>
          <p id="usuarioLogado"></p>
        </div>

        <div>
          <button onclick="logout()">Sair</button>
        </div>
      </div>


      <div class="form-producao">
        <form id="formProducao">
          <label>Produto</label>
          <select id="produtoSelect" required></select>

          <label>Tipo</label>
          <select id="tipo" required>
            <option value="fabricado">Fabricado</option>
            <option value="pedido">Pedido</option>
          </select>

          <label>Quantidade</label>
          <input type="number" id="quantidadeProd" required>

          <button type="submit">Registrar</button>
        </form>
      </div>

      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Produto</th>
              <th>Tipo</th>
              <th>Quantidade</th>
              <th>Data</th>
            </tr>
          </thead>
          <tbody id="listaProducao"></tbody>
        </table>
      </div>
    </main>

  </div>

  <script src="script.js"></script>
</body>

</html>
